spring:
  application:
    name: museclass
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/museclass}
    username: ${DB_USER:museclass}
    password: ${DB_PASSWORD:museclass}
    hikari:
      maximum-pool-size: 8    # малині більше не треба
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  # Funnel термінує HTTPS і проксить на localhost; довіряємо X-Forwarded-*,
  # бо назовні порт відкритий тільки через Funnel (див. compose.yaml).
  forward-headers-strategy: framework
  shutdown: graceful

museclass:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:30d}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
